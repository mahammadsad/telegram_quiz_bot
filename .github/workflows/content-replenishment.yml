name: Verified content replenishment

on:
  schedule:
    # Keep provider-heavy background generation outside the 07:00–19:00 IST
    # learner delivery window. Manual bounded runs remain available.
    - cron: "20 17,23 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Protected Supabase environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      limit:
        description: Maximum small batches
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: content-replenishment-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    env:
      EXPECTED_SUPABASE_PROJECT_REF: ${{ inputs.target == 'staging' && 'prdrabmcivgbygzjnmko' || 'tizxodkcpglmxgtwepor' }}
      SUPABASE_URL: ${{ inputs.target == 'staging' && 'https://prdrabmcivgbygzjnmko.supabase.co' || 'https://tizxodkcpglmxgtwepor.supabase.co' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY_PRIMARY: ${{ secrets.GEMINI_API_KEY_PRIMARY }}
      GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
      GEMINI_MODEL_PRIMARY: gemini-3.1-flash-lite
      GEMINI_MODEL_FALLBACK: gemini-2.5-flash
      GEMINI_VERIFIER_MODEL: gemini-3.5-flash-lite
      GEMINI_FAILOVER_ENABLED: "true"
      LIMIT: ${{ inputs.limit || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.lock
      - name: Replenish verified question inventory
        run: python -m scripts.replenish_question_inventory --limit "$LIMIT"
      - name: Report inventory days and replenishment gap
        run: |
          mkdir -p reports
          python -m scripts.report_question_inventory \
            | tee reports/question-inventory.json

      - name: Archive answer-free inventory capacity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: question-inventory-${{ github.run_id }}
          path: reports/question-inventory.json
          if-no-files-found: warn
          retention-days: 30

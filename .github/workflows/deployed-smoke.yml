name: Canonical deployment smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Canonical deployed application HTTPS URL
        required: true
        default: https://telegram-quiz-bot-h7p1.onrender.com
      quiz_id:
        description: Posted answer-free quiz ID for synthetic smoke
        required: true
      expected_commit:
        description: Expected deployed full commit SHA
        required: true
      authenticated:
        description: Run synthetic authenticated start/submit/dashboard checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  canonical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.lock
      - name: Verify canonical release
        env:
          SMOKE_TELEGRAM_INIT_DATA: ${{ secrets.SMOKE_TELEGRAM_INIT_DATA }}
        run: >-
          python -m scripts.deployed_smoke
          --base-url "${{ inputs.base_url }}"
          --expected-commit "${{ inputs.expected_commit }}"
          --quiz-id "${{ inputs.quiz_id }}"
          ${{ inputs.authenticated && '--authenticated' || '' }}

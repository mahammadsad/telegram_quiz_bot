name: Staging Quiz Smoke

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe staging operation
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - subject-quiz
      subject:
        description: One enabled, source-covered subject
        required: true
        default: computer
        type: choice
        options:
          - computer
          - bengali
          - reasoning
          - mathematics
          - english
          - miscellaneous
          - polity
          - geography
          - science
          - economics
          - history
          - environment
          - current-affairs
      verify_status:
        description: Read sanitized staging health after the operation
        required: false
        default: true
        type: boolean
      force_post:
        description: Repost an existing certified pack (normally disabled)
        required: false
        default: false
        type: boolean
      force_regenerate:
        description: Replace one selected staging pack (normally disabled)
        required: false
        default: false
        type: boolean
      safety_ack:
        description: Required only for a force option; enter the documented staging phrase
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-quiz-smoke
  cancel-in-progress: false

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      APP_TIMEZONE: Asia/Kolkata
      EXPECTED_SUPABASE_PROJECT_REF: prdrabmcivgbygzjnmko
      SUPABASE_URL: https://prdrabmcivgbygzjnmko.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_FORUM_TOPICS_JSON: ${{ secrets.TELEGRAM_FORUM_TOPICS_JSON }}
      TELEGRAM_GENERAL_THREAD_ID: ${{ secrets.TELEGRAM_GENERAL_THREAD_ID }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      MINIAPP_SHORT_NAME: ${{ vars.MINIAPP_SHORT_NAME }}
      GEMINI_API_KEY_PRIMARY: ${{ secrets.GEMINI_API_KEY_PRIMARY }}
      GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
      GEMINI_MODEL_PRIMARY: gemini-3.1-flash-lite
      GEMINI_MODEL_FALLBACK: gemini-2.5-flash
      GEMINI_FAILOVER_ENABLED: "true"
      DEV_ALLOW_UNVERIFIED_TELEGRAM: "false"
      WRITE_STATIC_QUIZ_JSON: "false"
      SOURCE_BACKED_ROTATION_ENABLED: "true"
      RENDER_STAGING_URL: https://telegram-quiz-bot-staging.onrender.com
      INPUT_OPERATION: ${{ inputs.operation }}
      INPUT_SUBJECT: ${{ inputs.subject }}
      INPUT_FORCE_POST: ${{ inputs.force_post }}
      INPUT_FORCE_REGENERATE: ${{ inputs.force_regenerate }}
      INPUT_SAFETY_ACK: ${{ inputs.safety_ack }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fail-closed staging identity and operation gate
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          from config.subjects import get_subject

          expected_ref = "prdrabmcivgbygzjnmko"
          expected_host = f"{expected_ref}.supabase.co"
          if os.environ.get("EXPECTED_SUPABASE_PROJECT_REF") != expected_ref:
              raise SystemExit("Refusing operation: expected staging project ref is not exact.")
          if urlparse(os.environ.get("SUPABASE_URL", "")).hostname != expected_host:
              raise SystemExit("Refusing operation: Supabase URL is not the staging project.")
          if os.environ.get("DEV_ALLOW_UNVERIFIED_TELEGRAM") != "false":
              raise SystemExit("Refusing operation: unverified Telegram users must remain disabled.")
          if os.environ.get("WRITE_STATIC_QUIZ_JSON") != "false":
              raise SystemExit("Refusing operation: staging must never write public fallbacks.")
          if os.environ.get("APP_TIMEZONE") != "Asia/Kolkata":
              raise SystemExit("Refusing operation: staging timezone mismatch.")

          required = (
              "SUPABASE_URL",
              "SUPABASE_SERVICE_KEY",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
              "TELEGRAM_FORUM_TOPICS_JSON",
              "TELEGRAM_GENERAL_THREAD_ID",
              "TELEGRAM_BOT_USERNAME",
              "MINIAPP_SHORT_NAME",
          )
          if [name for name in required if not os.environ.get(name)]:
              raise SystemExit("Refusing operation: required staging configuration is incomplete.")
          if not (
              os.environ.get("GEMINI_API_KEY_PRIMARY")
              or os.environ.get("GEMINI_API_KEY_SECONDARY")
          ):
              raise SystemExit("Refusing operation: no staging Gemini credential is configured.")

          operation = os.environ.get("INPUT_OPERATION", "")
          subject = os.environ.get("INPUT_SUBJECT", "")
          if operation not in {"preflight", "subject-quiz"}:
              raise SystemExit("Refusing operation: unsupported staging mode.")
          get_subject(subject, require_quiz_enabled=True)

          force_post = os.environ.get("INPUT_FORCE_POST", "false").lower() == "true"
          force_regenerate = (
              os.environ.get("INPUT_FORCE_REGENERATE", "false").lower() == "true"
          )
          if force_post and force_regenerate:
              raise SystemExit("Refusing operation: force flags are mutually exclusive.")
          if (force_post or force_regenerate) and operation != "subject-quiz":
              raise SystemExit("Refusing operation: force flags require one subject quiz.")
          expected_ack = f"ALLOW FORCE ON STAGING {expected_ref}"
          if (force_post or force_regenerate) and os.environ.get("INPUT_SAFETY_ACK") != expected_ack:
              raise SystemExit("Refusing operation: staging force acknowledgement is not exact.")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
              handle.write(f"subject={subject}\n")
              handle.write(f"force_post={str(force_post).lower()}\n")
              handle.write(f"force_regenerate={str(force_regenerate).lower()}\n")
          print("Staging identity, configuration presence, and operation gate passed.")
          PY

      - name: Install locked dependencies
        run: pip install --disable-pip-version-check -r requirements.lock

      - name: Sanitized staging preflight
        run: python bot.py --mode preflight

      - name: Generate and post exactly one selected subject quiz
        if: steps.gate.outputs.operation == 'subject-quiz'
        shell: bash
        run: |
          args=(--mode subject-quiz --subject "${{ steps.gate.outputs.subject }}")
          if [ "${{ steps.gate.outputs.force_post }}" = "true" ]; then
            args+=(--force-post)
          fi
          if [ "${{ steps.gate.outputs.force_regenerate }}" = "true" ]; then
            args+=(--force-regenerate)
          fi
          python bot.py "${args[@]}"

      - name: Read sanitized staging health
        if: ${{ inputs.verify_status }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          from database.contract import (
              APPLICATION_VERSION,
              DATABASE_CONTRACT_VERSION,
              LEADERBOARD_PRIVACY_MIGRATION_VERSION,
              LEADERBOARD_PRIVACY_RPC_FIX_MIGRATION_VERSION,
              PERSONAL_LEARNING_MIGRATION_VERSION,
              PHASE_C_CANDIDATE_MIGRATION_VERSION,
              PHASE_C_IDENTITY_MIGRATION_VERSION,
              PHASE_C_INVENTORY_MIGRATION_VERSION,
              PHASE_D_CURRENT_AFFAIRS_MIGRATION_VERSION,
              PHASE_E_EXAM_CONFIGURATION_MIGRATION_VERSION,
              PHASE_E_PERSONAL_LEARNING_MIGRATION_VERSION,
              PHASE_E_PREVIOUS_YEAR_MOCK_MIGRATION_VERSION,
              PHASE_E_QUESTION_QUALITY_MIGRATION_VERSION,
              POST_FINALIZATION_MIGRATION_VERSION,
              QUIZ_JOBS_MIGRATION_VERSION,
              REQUIRED_MIGRATION_VERSION,
              SOURCE_ROLLOUT_MIGRATION_VERSION,
          )

          base = os.environ["RENDER_STAGING_URL"].rstrip("/")
          operation = os.environ["INPUT_OPERATION"]
          for path in ("/health/live", "/health/ready"):
              try:
                  response = urlopen(base + path, timeout=30)
              except HTTPError as exc:
                  response = exc
              with response:
                  body = json.load(response)
              status = response.getcode()
              safe = {
                  "path": path,
                  "status": status,
                  "applicationVersion": body.get("applicationVersion"),
                  "databaseContractVersion": body.get("databaseContractVersion"),
                  "requiredMigrationVersion": body.get("requiredMigrationVersion"),
                  "sourceRolloutMigrationVersion": body.get(
                      "sourceRolloutMigrationVersion"
                  ),
                  "personalLearningMigrationVersion": body.get(
                      "personalLearningMigrationVersion"
                  ),
                  "leaderboardPrivacyMigrationVersion": body.get(
                      "leaderboardPrivacyMigrationVersion"
                  ),
                  "leaderboardPrivacyRpcFixMigrationVersion": body.get(
                      "leaderboardPrivacyRpcFixMigrationVersion"
                  ),
                  "postFinalizationMigrationVersion": body.get(
                      "postFinalizationMigrationVersion"
                  ),
                  "quizJobsMigrationVersion": body.get(
                      "quizJobsMigrationVersion"
                  ),
                  "phaseCIdentityMigrationVersion": body.get(
                      "phaseCIdentityMigrationVersion"
                  ),
                  "phaseCInventoryMigrationVersion": body.get(
                      "phaseCInventoryMigrationVersion"
                  ),
                  "phaseCCandidateMigrationVersion": body.get(
                      "phaseCCandidateMigrationVersion"
                  ),
                  "phaseDCurrentAffairsMigrationVersion": body.get(
                      "phaseDCurrentAffairsMigrationVersion"
                  ),
                  "phaseEPersonalLearningMigrationVersion": body.get(
                      "phaseEPersonalLearningMigrationVersion"
                  ),
                  "phaseEExamConfigurationMigrationVersion": body.get(
                      "phaseEExamConfigurationMigrationVersion"
                  ),
                  "phaseEPreviousYearMockMigrationVersion": body.get(
                      "phaseEPreviousYearMockMigrationVersion"
                  ),
                  "phaseEQuestionQualityMigrationVersion": body.get(
                      "phaseEQuestionQualityMigrationVersion"
                  ),
                  "sourceBackedRotationEnabled": body.get(
                      "sourceBackedRotationEnabled"
                  ),
                  "ready": body.get("status") == "ready",
                  "checks": body.get("checks"),
                  "failureCategories": body.get("failureCategories"),
              }
              print(json.dumps(safe, sort_keys=True))

              if body.get("applicationVersion") != APPLICATION_VERSION:
                  raise SystemExit("Staging application version is not the release candidate.")
              if path == "/health/live":
                  if status != 200:
                      raise SystemExit("Staging liveness is not HTTP 200.")
                  continue

              if body.get("databaseContractVersion") != DATABASE_CONTRACT_VERSION:
                  raise SystemExit("Staging database contract version mismatch.")
              if body.get("requiredMigrationVersion") != REQUIRED_MIGRATION_VERSION:
                  raise SystemExit("Staging migration version mismatch.")
              if (
                  body.get("personalLearningMigrationVersion")
                  != PERSONAL_LEARNING_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging personal-learning migration mismatch.")
              if (
                  body.get("leaderboardPrivacyMigrationVersion")
                  != LEADERBOARD_PRIVACY_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging leaderboard-privacy migration mismatch.")
              if (
                  body.get("leaderboardPrivacyRpcFixMigrationVersion")
                  != LEADERBOARD_PRIVACY_RPC_FIX_MIGRATION_VERSION
              ):
                  raise SystemExit(
                      "Staging leaderboard-privacy RPC fix migration mismatch."
                  )
              if body.get("checks", {}).get("leaderboardPrivacy") is not True:
                  raise SystemExit("Staging leaderboard privacy is not ready.")
              if (
                  body.get("postFinalizationMigrationVersion")
                  != POST_FINALIZATION_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging post-finalization migration mismatch.")
              if body.get("checks", {}).get("postFinalization") is not True:
                  raise SystemExit("Staging atomic post finalization is not ready.")
              if body.get("quizJobsMigrationVersion") != QUIZ_JOBS_MIGRATION_VERSION:
                  raise SystemExit("Staging durable quiz-jobs migration mismatch.")
              if body.get("checks", {}).get("durableQuizJobs") is not True:
                  raise SystemExit("Staging durable quiz jobs are not ready.")
              if (
                  body.get("phaseCIdentityMigrationVersion")
                  != PHASE_C_IDENTITY_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase C identity migration mismatch.")
              if (
                  body.get("phaseCInventoryMigrationVersion")
                  != PHASE_C_INVENTORY_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase C inventory migration mismatch.")
              if (
                  body.get("phaseCCandidateMigrationVersion")
                  != PHASE_C_CANDIDATE_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase C candidate migration mismatch.")
              if body.get("checks", {}).get("contentIdentity") is not True:
                  raise SystemExit("Staging content identity is not ready.")
              if body.get("checks", {}).get("verifiedInventory") is not True:
                  raise SystemExit("Staging verified inventory is not ready.")
              if (
                  body.get("phaseDCurrentAffairsMigrationVersion")
                  != PHASE_D_CURRENT_AFFAIRS_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase D current-affairs migration mismatch.")
              if body.get("checks", {}).get("currentAffairsEvents") is not True:
                  raise SystemExit("Staging current-affairs event pipeline is not ready.")
              if (
                  body.get("phaseEPersonalLearningMigrationVersion")
                  != PHASE_E_PERSONAL_LEARNING_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase E personal-learning migration mismatch.")
              if body.get("checks", {}).get("personalKnowledgeMastery") is not True:
                  raise SystemExit("Staging personal knowledge mastery is not ready.")
              if (
                  body.get("phaseEExamConfigurationMigrationVersion")
                  != PHASE_E_EXAM_CONFIGURATION_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase E exam configuration mismatch.")
              if body.get("checks", {}).get("examConfiguration") is not True:
                  raise SystemExit("Staging exam configuration is not ready.")
              if (
                  body.get("phaseEPreviousYearMockMigrationVersion")
                  != PHASE_E_PREVIOUS_YEAR_MOCK_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase E previous-year/mock migration mismatch.")
              if body.get("checks", {}).get("previousYearMocks") is not True:
                  raise SystemExit("Staging previous-year/mock engine is not ready.")
              if (
                  body.get("phaseEQuestionQualityMigrationVersion")
                  != PHASE_E_QUESTION_QUALITY_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging Phase E question-quality migration mismatch.")
              if (
                  body.get("checks", {}).get("questionQualityAdministration")
                  is not True
              ):
                  raise SystemExit("Staging question-quality administration is not ready.")
              if (
                  body.get("sourceRolloutMigrationVersion")
                  != SOURCE_ROLLOUT_MIGRATION_VERSION
              ):
                  raise SystemExit("Staging source-rollout migration mismatch.")
              if body.get("sourceBackedRotationEnabled") is not True:
                  raise SystemExit("Staging source-backed rotation is not enabled.")
              if operation == "subject-quiz":
                  if status != 200 or body.get("status") != "ready":
                      raise SystemExit(
                          "Staging readiness must be HTTP 200 after quiz creation."
                      )
              elif status == 503:
                  failures = body.get("failureCategories") or []
                  checks = body.get("checks") or {}
                  expected_checks = {
                      "criticalEnvironment",
                      "environmentOwnership",
                      "telegramConfiguration",
                      "aiConfiguration",
                      "supabaseConnectivity",
                      "databaseContract",
                      "databasePermissions",
                      "leaderboardPrivacy",
                      "postFinalization",
                      "durableQuizJobs",
                      "contentIdentity",
                      "verifiedInventory",
                      "currentAffairsEvents",
                      "personalKnowledgeMastery",
                      "examConfiguration",
                      "previousYearMocks",
                      "activeQuizRetrieval",
                  }
                  if (
                      failures != ["active_quiz_retrieval"]
                      or set(checks) != expected_checks
                      or checks.get("activeQuizRetrieval") is not False
                      or any(
                          not value
                          for name, value in checks.items()
                          if name != "activeQuizRetrieval"
                      )
                  ):
                      raise SystemExit(
                          "Pre-quiz readiness has an unexpected failure category."
                      )
              elif status != 200 or body.get("status") != "ready":
                  raise SystemExit(
                      "Preflight readiness must be ready or fail only the active quiz probe."
                  )
          PY

name: Current Affairs Sources

on:
  schedule:
    - cron: "30 0,12 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Protected Supabase environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      operation:
        description: Validate official PIB coverage or refresh verified rows
        required: true
        default: validate
        type: choice
        options: [validate, refresh]
      safety_ack:
        description: Required for refresh; copy the target-specific phrase from the rollout runbook
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: current-affairs-sources-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  refresh-current-affairs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    env:
      TARGET: ${{ inputs.target || 'production' }}
      OPERATION: ${{ github.event_name == 'schedule' && 'refresh' || inputs.operation }}
      SAFETY_ACK: ${{ inputs.safety_ack }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ inputs.target == 'staging' && 'prdrabmcivgbygzjnmko' || 'tizxodkcpglmxgtwepor' }}
      SUPABASE_URL: ${{ inputs.target == 'staging' && 'https://prdrabmcivgbygzjnmko.supabase.co' || 'https://tizxodkcpglmxgtwepor.supabase.co' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install --disable-pip-version-check -r requirements.lock
      - name: Fail-closed target and refresh gate
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          refs = {
              "staging": "prdrabmcivgbygzjnmko",
              "production": "tizxodkcpglmxgtwepor",
          }
          target = os.environ.get("TARGET", "")
          operation = os.environ.get("OPERATION", "")
          expected_ref = refs.get(target)
          if not expected_ref or os.environ.get("EXPECTED_SUPABASE_PROJECT_REF") != expected_ref:
              raise SystemExit("Refusing operation: target identity is not exact.")
          if operation not in {"validate", "refresh"}:
              raise SystemExit("Refusing operation: unsupported current-affairs mode.")
          if operation == "refresh":
              if urlparse(os.environ.get("SUPABASE_URL", "")).hostname != (
                  f"{expected_ref}.supabase.co"
              ):
                  raise SystemExit("Refusing refresh: Supabase URL is not the selected target.")
              if not os.environ.get("SUPABASE_SERVICE_KEY"):
                  raise SystemExit("Refusing refresh: service configuration is incomplete.")
              if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
                  expected_ack = f"REFRESH PIB SOURCES IN {target.upper()} {expected_ref}"
                  if os.environ.get("SAFETY_ACK") != expected_ack:
                      raise SystemExit(
                          "Refusing refresh: enter the exact PIB-source acknowledgement."
                      )
          print("target_identity=true")
          print(f"operation={operation}")
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Read sanitized database contract before refresh
        if: env.OPERATION == 'refresh'
        run: |
          python - <<'PY'
          from database.client import get_client

          contract = get_client().rpc("get_application_schema_contract").execute().data
          if (
              not isinstance(contract, dict)
              or contract.get("contract_key") != "telegram_quiz_api"
              or contract.get("contract_version") != "2.2.0"
              or contract.get("required_migration_version") != "20260724212939"
          ):
              raise SystemExit("Refusing refresh: database contract identity is not exact.")
          print("database_contract_identity=true")
          PY
      - name: Validate official PIB source coverage
        if: env.OPERATION == 'validate'
        run: >-
          python scripts/refresh_current_affairs_sources.py
          --max-items 200 --minimum-per-chapter 4 --validate-only
      - name: Refresh verified official PIB source rows
        if: env.OPERATION == 'refresh'
        run: >-
          python scripts/refresh_current_affairs_sources.py
          --max-items 200 --minimum-per-chapter 4 --approve
      - name: Read back every selected chapter
        if: env.OPERATION == 'refresh'
        run: python scripts/check_source_readiness.py --scope all
